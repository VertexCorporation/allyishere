<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 | Ally</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/main.css">
  <script>
    try {
      var t = localStorage.getItem("ally-theme");
      if (t !== "light" && t !== "dark") t = "dark";
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
</head>
<body>
  <main class="nf-main" id="main">
    <svg class="brand-mark" viewBox="0 0 96 96" aria-hidden="true" focusable="false"><path d="M25 84 L48 12 L71 84" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M34.2 56 H43 L48.8 40 L54.5 68 L57.6 56 H61.8" fill="none" stroke="currentColor" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M48 5 L53 12 L48 19 L43 12 Z" fill="var(--accent)" stroke="none"/></svg>
    <h1 class="nf-code">404</h1>
    <p id="nf-message">The page you are looking for does not exist or has been moved.</p>
    <a class="btn btn-primary" id="nf-home" href="/en/">Back to homepage</a>
  </main>

  <script>
    /* Localize the fixed set of strings on the error page. The page is served
       for arbitrary URLs, so the message is chosen client-side. */
    (function () {
      "use strict";
      var messages = {
        en: { lang: "en", dir: "ltr", title: "404 | Ally", message: "The page you are looking for does not exist or has been moved.", link: "Back to homepage" },
        ar: { lang: "ar", dir: "rtl", title: "404 | Ally", message: "الصفحة التي تبحث عنها غير موجودة أو تم نقلها.", link: "العودة إلى الصفحة الرئيسية" },
        az: { lang: "az", dir: "ltr", title: "404 | Ally", message: "Axtardığınız səhifə mövcud deyil və ya daşınıb.", link: "Ana səhifəyə qayıt" },
        de: { lang: "de", dir: "ltr", title: "404 | Ally", message: "Die gesuchte Seite existiert nicht oder wurde verschoben.", link: "Zur Startseite" },
        es: { lang: "es", dir: "ltr", title: "404 | Ally", message: "La página que buscas no existe o ha sido movida.", link: "Volver a la página principal" },
        fr: { lang: "fr", dir: "ltr", title: "404 | Ally", message: "La page que vous recherchez n'existe pas ou a été déplacée.", link: "Retour à l'accueil" },
        hi: { lang: "hi", dir: "ltr", title: "404 | Ally", message: "आप जिस पृष्ठ की तलाश कर रहे हैं वह मौजूद नहीं है या स्थानांतरित कर दिया गया है।", link: "मुखपृष्ठ पर लौटें" },
        id: { lang: "id", dir: "ltr", title: "404 | Ally", message: "Halaman yang kamu cari tidak ada atau telah dipindahkan.", link: "Kembali ke Beranda" },
        it: { lang: "it", dir: "ltr", title: "404 | Ally", message: "La pagina che stai cercando non esiste o è stata spostata.", link: "Torna alla home" },
        ja: { lang: "ja", dir: "ltr", title: "404 | Ally", message: "お探しのページは存在しないか、移動された可能性があります。", link: "ホームに戻る" },
        ko: { lang: "ko", dir: "ltr", title: "404 | Ally", message: "찾으시는 페이지가 존재하지 않거나 이동되었습니다.", link: "홈으로 돌아가기" },
        ku: { lang: "ku", dir: "ltr", title: "404 | Ally", message: "Rûpela ku hûn lê digerin tune ye an jî hatiye veguheztin.", link: "Vegere Serûpel" },
        nl: { lang: "nl", dir: "ltr", title: "404 | Ally", message: "De pagina die je zoekt bestaat niet of is verplaatst.", link: "Terug naar de startpagina" },
        pt: { lang: "pt", dir: "ltr", title: "404 | Ally", message: "A página que você procura não existe ou foi movida.", link: "Voltar para a página inicial" },
        ru: { lang: "ru", dir: "ltr", title: "404 | Ally", message: "Страница, которую вы ищете, не существует или была перемещена.", link: "Вернуться на главную" },
        tr: { lang: "tr", dir: "ltr", title: "404 | Ally", message: "Aradığınız sayfa mevcut değil veya taşınmış olabilir.", link: "Ana sayfaya dön" },
        zh: { lang: "zh", dir: "ltr", title: "404 | Ally", message: "你要找的页面不存在或已被移动。", link: "返回首页" }
      };

      try {
        var stored = localStorage.getItem("ally_language");
        var base = String(navigator.language || "en").toLowerCase().split("-")[0];
        var lang = (stored && messages[stored]) ? stored : (messages[base] ? base : "en");
        var m = messages[lang];

        document.documentElement.lang = lang;
        document.documentElement.dir = m.dir;
        document.title = m.title;

        var msg = document.getElementById("nf-message");
        var link = document.getElementById("nf-home");
        if (msg) msg.textContent = m.message;
        if (link) {
          link.textContent = m.link;
          link.href = "/" + lang + "/";
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
