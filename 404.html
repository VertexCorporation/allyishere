<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page not found | Ally by Vertex</title>
  <meta name="robots" content="noindex" />

  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/main.css" />
  <script>
    try {
      var t = localStorage.getItem("ally-theme") || localStorage.getItem("theme") || "dark";
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>

  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; }

    .triangles {
      position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none;
    }

    .triangles li {
      position: absolute; display: block; width: 20px; height: 20px;
      background: var(--surface-2);
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      animation: triangleAnimate 25s linear infinite;
      bottom: -180px;
    }

    .triangles li:nth-child(1) { left: 25%; width: 80px; height: 80px; }
    .triangles li:nth-child(2) { left: 10%; animation-delay: 2s; animation-duration: 12s; }
    .triangles li:nth-child(3) { left: 70%; animation-delay: 4s; }
    .triangles li:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-duration: 18s; }
    .triangles li:nth-child(5) { left: 65%; }
    .triangles li:nth-child(6) { left: 75%; width: 110px; height: 110px; animation-delay: 3s; }
    .triangles li:nth-child(7) { left: 55%; animation-delay: 6s; }
    .triangles li:nth-child(8) { left: 20%; width: 34px; height: 34px; animation-delay: 8s; }

    @keyframes triangleAnimate {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.8; }
      100% { transform: translateY(-110vh) rotate(720deg); opacity: 0; }
    }

    .nf { position: relative; z-index: 1; text-align: center; padding: 32px; }
    .nf .mark { width: 56px; height: 56px; margin: 0 auto 18px; opacity: 0.9; }
    .nf .code {
      font-family: "Anton", sans-serif;
      font-size: clamp(88px, 18vw, 168px);
      line-height: 1;
      color: var(--ink);
      margin: 0 0 8px;
    }
    .nf p { color: var(--ink-soft); font-size: 1rem; max-width: 420px; margin: 0 auto 30px; }
  </style>
</head>

<body>
  <main class="nf">
    <svg class="mark" viewBox="0 0 96 96" aria-hidden="true" focusable="false"><path d="M26 82 L48 14 L70 82" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M33.8 58 L44 58 L49 44 L54 68 L57 58 L62.2 58" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1 class="code">404</h1>
    <p id="error-message">The page you are looking for does not exist or has been moved.</p>
    <a class="btn btn-solid" id="home-link" href="/">Back to homepage</a>
  </main>

  <ul class="triangles" aria-hidden="true">
    <li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li>
  </ul>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var translations = {
        en: { title: "404 - Page not found", message: "The page you are looking for does not exist or has been moved.", link: "Back to homepage", dir: "ltr" },
        tr: { title: "404 - Sayfa bulunamadı", message: "Aradığınız sayfa mevcut değil veya taşınmış olabilir.", link: "Ana sayfaya dön", dir: "ltr" },
        az: { title: "404 - Səhifə tapılmadı", message: "Axtardığınız səhifə mövcud deyil və ya daşınıb.", link: "Ana səhifəyə qayıt", dir: "ltr" },
        de: { title: "404 - Seite nicht gefunden", message: "Ups! Die gesuchte Seite existiert nicht oder wurde verschoben.", link: "Zur Startseite", dir: "ltr" },
        es: { title: "404 - Página no encontrada", message: "¡Vaya! La página que buscas no existe o ha sido movida.", link: "Volver a la página principal", dir: "ltr" },
        fr: { title: "404 - Page introuvable", message: "Oups ! La page que vous recherchez n'existe pas ou a été déplacée.", link: "Retour à l'accueil", dir: "ltr" },
        hi: { title: "404 - पृष्ठ नहीं मिला", message: "ओह! आप जिस पृष्ठ की तलाश कर रहे हैं वह मौजूद नहीं है या स्थानांतरित कर दिया गया है।", link: "मुखपृष्ठ पर लौटें", dir: "ltr" },
        id: { title: "404 - Halaman Tidak Ditemukan", message: "Ups! Halaman yang kamu cari tidak ada atau telah dipindahkan.", link: "Kembali ke Beranda", dir: "ltr" },
        it: { title: "404 - Pagina non trovata", message: "Ops! La pagina che stai cercando non esiste o è stata spostata.", link: "Torna alla home", dir: "ltr" },
        ja: { title: "404 - ページが見つかりません", message: "おっと！お探しのページは存在しないか、移動された可能性があります。", link: "ホームに戻る", dir: "ltr" },
        ko: { title: "404 - 페이지를 찾을 수 없음", message: "앗! 찾으시는 페이지가 존재하지 않거나 이동되었습니다.", link: "홈으로 돌아가기", dir: "ltr" },
        ku: { title: "404 - Rûpel Nehat Dîtin", message: "Ax! Rûpela ku hûn lê digerin tune ye an jî hatiye veguheztin.", link: "Vegere Serûpel", dir: "ltr" },
        nl: { title: "404 - Pagina niet gevonden", message: "Oeps! De pagina die je zoekt bestaat niet of is verplaatst.", link: "Terug naar de startpagina", dir: "ltr" },
        pt: { title: "404 - Página não encontrada", message: "Ops! A página que você procura não existe ou foi movida.", link: "Voltar para a página inicial", dir: "ltr" },
        ru: { title: "404 - Страница не найдена", message: "Упс! Страница, которую вы ищете, не существует или была перемещена.", link: "Вернуться на главную", dir: "ltr" },
        zh: { title: "404 - 页面未找到", message: "哎呀！你要找的页面不存在或已被移动。", link: "返回首页", dir: "ltr" }
      };

      var rawLang = (navigator.language || "en").toLowerCase();
      var userLang = rawLang.split("-")[0];
      var lang = translations[userLang] ? userLang : "en";
      var content = translations[lang];

      document.documentElement.lang = lang;
      document.documentElement.dir = content.dir;

      document.title = content.title;
      var msgEl = document.getElementById("error-message");
      var linkEl = document.getElementById("home-link");

      if (msgEl) msgEl.textContent = content.message;
      if (linkEl) linkEl.textContent = content.link;
    });
  </script>
</body>

</html>
