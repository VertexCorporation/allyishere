<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ally | Vertex</title>
  <meta name="description" content="Ally is a proactive health companion from Vertex Corporation. Always by your side.">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://allyishere.com/">
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

  <!-- No-JS fallback: the JS router below may pick a better match. -->
  <meta http-equiv="refresh" content="0; url=/en/">
  <script>
    /* Language negotiation: stored choice first, then browser languages.
       Disabled with ?noredirect for manual inspection. */
    (function () {
      "use strict";
      try {
        var params = new URLSearchParams(window.location.search);
        if (params.has("noredirect")) return;

        var supported = ["ar", "az", "de", "en", "es", "fr", "hi", "id", "it", "ja", "ko", "ku", "nl", "pt", "ru", "tr", "zh"];

        function pick() {
          var stored = null;
          try { stored = localStorage.getItem("ally_language"); } catch (e) {}
          if (stored && supported.indexOf(stored) !== -1) return stored;
          var langs = navigator.languages || [navigator.language];
          for (var i = 0; i < langs.length; i++) {
            var base = String(langs[i] || "").toLowerCase().split("-")[0];
            if (supported.indexOf(base) !== -1) return base;
          }
          return "en";
        }

        var target = pick();
        try { localStorage.setItem("ally_language", target); } catch (e) {}
        window.location.replace("/" + target + "/");
      } catch (e) {}
    })();
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-content: center;
      font-family: system-ui, sans-serif;
      background: #F7F9FB;
      color: #10151B;
    }
    a { color: #155EE0; }
    @media (prefers-color-scheme: dark) {
      body { background: #0E1116; color: #EDF1F7; }
    }
  </style>
</head>
<body>
  <main>
    <p>Redirecting… <a href="/en/">Continue to Ally</a></p>
  </main>
</body>
</html>
